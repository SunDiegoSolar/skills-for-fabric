<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Log in — Splash Canvas</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="login-page">
  <main class="login-sheet">
    <p class="brand">Splash Canvas</p>
    <h1>Log in</h1>
    <p class="muted" id="login-mode">Checking whether this host has a server session…</p>
    <p id="login-error" class="login-error"></p>
    <div id="login-signed" hidden>
      <p id="login-signed-name"></p>
      <div class="row">
        <a class="button" href="./index.html">Open mapping studio</a>
        <button type="button" class="ghost" id="login-signout">Sign out</button>
      </div>
    </div>
    <form id="login-form">
      <label>Name
        <input id="login-name" name="name" type="text" autocomplete="username" required />
      </label>
      <label>Password
        <input id="login-pass" name="password" type="password" autocomplete="current-password" />
      </label>
      <div class="row">
        <button type="submit" id="login-submit">Sign in</button>
        <button type="button" class="ghost" id="login-register">Create account</button>
      </div>
      <div class="row">
        <a class="button ghost" href="./index.html" id="login-guest">Continue as guest</a>
      </div>
    </form>
  </main>
  <div id="toast" hidden></div>
  <script type="module">
    import { createAuth } from "./js/auth.js?v=4";
    const toast = (message) => {
      const el = document.getElementById("toast");
      el.hidden = false;
      el.textContent = message;
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.hidden = true; }, 2400);
    };
    createAuth({ toast }).bind();
  </script>
</body>
</html>
