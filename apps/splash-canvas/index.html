<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splash Canvas — mapping studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0c10'/%3E%3Ccircle cx='22' cy='24' r='10' fill='%23e8c07a'/%3E%3Ccircle cx='44' cy='40' r='12' fill='%235a90d0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-mode="geometry">
  <header id="chrome">
    <div class="brand">Splash Canvas</div>
    <nav>
      <button type="button" data-mode="geometry" class="active">Geometry</button>
      <button type="button" data-mode="warp">Warp</button>
      <button type="button" data-mode="mask">Mask</button>
      <button type="button" data-mode="present">Present</button>
    </nav>
    <div class="right">
      <button type="button" id="pick-files">Open Splash files</button>
      <button type="button" class="ghost" id="fullscreen">Fullscreen</button>
    </div>
  </header>

  <main id="workspace">
    <section id="viewport">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <p id="hint">Drop splash.json, OBJ meshes, photos, or video. Click a face to pin. Pinch to scale a section. Paint mask to omit.</p>
    </section>
    <aside id="side">
      <h2>Graph</h2>
      <div id="graph"></div>
      <h2>Faces</h2>
      <div id="face-list"></div>
      <h2>Selected face</h2>
      <div class="row">
        <button type="button" id="omit-face">Omit / restore face</button>
      </div>
      <label>Animation
        <select id="anim-dir">
          <option value="off">Off</option>
          <option value="u+">Move U →</option>
          <option value="u-">Move U ←</option>
          <option value="v+">Move V ↑</option>
          <option value="v-">Move V ↓</option>
        </select>
      </label>
      <label>Speed
        <input id="anim-speed" type="range" min="0" max="40" value="8" />
      </label>
      <h2>Black / mask</h2>
      <label>Pixel omit
        <select id="omit-black">
          <option value="0">Show all color</option>
          <option value="1">Omit black (no color on dark)</option>
          <option value="2">Only black (vice versa)</option>
        </select>
      </label>
      <label>Luma threshold
        <input id="threshold" type="range" min="0" max="60" value="8" />
      </label>
      <label>Black level (Splash lift)
        <input id="black-level" type="range" min="0" max="80" value="0" />
      </label>
      <label class="check"><input id="invert-mask" type="checkbox" /> Invert painted mask</label>
      <label class="check"><input id="invert-faces" type="checkbox" /> Invert omitted faces</label>
      <div class="row">
        <button type="button" class="ghost" id="clear-mask">Clear mask</button>
        <button type="button" class="ghost" id="reset-warp">Reset warp grid</button>
      </div>
      <p class="muted">Keys: 1 geometry · 2 warp · 3 mask · 4 present · O omit face. Shift-drag on mask restores color.</p>
    </aside>
  </main>

  <input id="files" type="file" hidden multiple accept=".json,.obj,image/*,video/*" />
  <div id="toast" hidden></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
